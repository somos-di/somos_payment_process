services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - somos

  backend:
    build: ./app/backend
    env_file:
      - ./app/backend/.env
    environment:
      HOST: 0.0.0.0
      PORT: "4000"
      REDIS_URL: redis://redis:6379
    expose:
      - "4000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - somos

  frontend:
    build: ./app/frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - somos

  supabase_mcp:
    build: ./app/services/mcps/supabase_mcp
    env_file:
      - ./app/services/mcps/supabase_mcp/.env
    expose:
      - "8000"
    restart: unless-stopped
    networks:
      - somos

  agent:
    build: ./app/services/agent
    env_file:
      - ./app/services/agent/.env
    environment:
      SUPABASE_MCP_URL: http://supabase_mcp:8000/mcp
      REDIS_URL: redis://redis:6379
    expose:
      - "8100"
    depends_on:
      supabase_mcp:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - somos

networks:
  somos:
    name: somos_net
