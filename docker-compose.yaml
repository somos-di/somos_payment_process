x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - somos

  backend:
    build: ./app/backend
    env_file:
      - ./app/backend/.env
    environment:
      HOST: 0.0.0.0
      PORT: "4000"
      REDIS_URL: redis://redis:6379
    expose:
      - "4000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - somos

  frontend:
    build: ./app/frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped
    logging: *default-logging
    networks:
      - somos

networks:
  # Criada manualmente no droplet (uma vez): docker network create somos_net
  # Assim todos os composes (payment, mcp, agent, creator) só ENTRAM nela,
  # sem depender da ordem de subida.
  somos:
    name: somos_net
    external: true
