<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Login — FLUXO</title>
</head>

<body>
    <main class="login-page">
        <div class="login-card">
            <div class="login-brand">
                <span class="brand-mark"></span>
                <div>
                    <div class="brand-name">FLUXO</div>
                    <div class="brand-sub">Processo de Pagamento</div>
                </div>
            </div>
            <h1>Entrar</h1>
            <form id="login-form" class="login-form">
                <div class="login-field">
                    <label for="login-email">E-mail</label>
                    <input id="login-email" type="email" name="email" required autocomplete="email">
                </div>
                <div class="login-field">
                    <label for="login-password">Senha</label>
                    <input id="login-password" type="password" name="password" required autocomplete="current-password">
                </div>
                <div id="login-error" class="login-error" aria-live="polite"></div>
                <button type="submit" id="login-submit" class="login-btn">Entrar</button>
            </form>

            <div class="login-divider"><span>ou</span></div>

            <button type="button" id="login-ms" class="login-btn-ms">
                <svg width="18" height="18" viewBox="0 0 23 23" aria-hidden="true">
                    <path fill="#f25022" d="M1 1h10v10H1z" />
                    <path fill="#7fba00" d="M12 1h10v10H12z" />
                    <path fill="#00a4ef" d="M1 12h10v10H1z" />
                    <path fill="#ffb900" d="M12 12h10v10H12z" />
                </svg>
                <span>Entrar com Microsoft</span>
            </button>
        </div>
    </main>
</body>

</html>
