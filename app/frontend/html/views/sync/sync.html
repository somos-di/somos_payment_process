<main>
  <div class="card" style="padding:20px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap">
      <div>
        <div class="section-title">Sincronização UAU</div>
        <div class="section-sub">Puxa os dados do UAU para o Supabase. Ative a <b>automação por tabela</b> — cada uma no
          seu próprio intervalo (ex.: Pessoas a cada 15 min, Compositions a cada 180 min).</div>
      </div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <label style="display:flex;align-items:center;gap:6px;font-size:13px"><input type="checkbox" id="auto-master"
            style="width:16px;height:16px"> Automação ligada</label>
        <button class="btn btn-light" id="auto-save">Salvar automação</button>
        <button class="btn btn-primary" id="sync-all">Sincronizar tudo</button>
      </div>
    </div>

    <table style="margin-top:16px">
      <thead>
        <tr>
          <th>Entidade</th>
          <th>Tabela</th>
          <th style="text-align:center">Auto</th>
          <th style="text-align:center">Intervalo (min)</th>
          <th>Última auto</th>
          <th>Status manual</th>
          <th style="text-align:right">Ação</th>
        </tr>
      </thead>
      <tbody id="sync-rows">
        <tr>
          <td colspan="7" class="empty">Carregando…</td>
        </tr>
      </tbody>
    </table>
    <div id="sync-msg" class="section-sub" style="margin-top:12px"></div>
  </div>
</main>
