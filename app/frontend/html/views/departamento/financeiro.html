<main>
  <style>
    .fin-alert-pop {
      position: fixed;
      z-index: 9998;
      max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--danger);
      border-left: 3px solid var(--danger);
      border-radius: 10px;
      box-shadow: var(--shadow-md);
      padding: 12px 14px;
      font-size: 13px;
      color: #9f1239;
    }

    .fin-alert-pop ul {
      margin: 0;
      padding-left: 16px;
    }

    .fin-alert-pop li {
      margin: 4px 0;
    }

    .fin-acts {
      white-space: nowrap;
      text-align: right;
    }

    .fin-acts .btn {
      margin-left: 6px;
    }
  </style>
  <div class="section-title">Financeiro</div>
  <div class="section-sub" style="margin-bottom:16px">Processos aprovados, em análise financeira. Visualize, ajuste
    parcelas, devolva para correção ou envie ao UAU.</div>

  <div class="card" style="padding:0">
    <div class="pl-toolbar">
      <div class="pl-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7" />
          <path d="M21 21l-4.3-4.3" />
        </svg>
        <input id="fin-search" placeholder="Buscar…">
      </div>
      <div class="pl-filters" id="fin-filters"></div>
      <div class="pl-toolbar-actions">
        <button class="btn btn-light" id="fin-refresh" title="Recarregar os dados desta tela">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px">
            <path d="M23 4v6h-6M1 20v-6h6" />
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
          </svg>Atualizar</button>
        <button class="btn btn-ghost" id="fin-clear">Limpar filtros</button>
      </div>
    </div>
    <div id="fin-body" style="padding:6px 0">
      <div class="empty">Carregando…</div>
    </div>
  </div>
</main>
