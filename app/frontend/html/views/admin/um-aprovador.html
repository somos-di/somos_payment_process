<main>
  <style>
    .ua-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .ua-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
    }

    .ua-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .ua-title {
      font-weight: 700;
      font-size: 15px;
      color: var(--text);
    }

    .ua-sub {
      color: var(--muted);
      font-size: 13.5px;
      margin-top: 3px;
    }

    .ua-diag {
      border-left: 3px solid var(--danger);
      background: var(--danger-weak);
      border-radius: 10px;
      padding: 14px 16px;
      margin-top: 14px;
      color: #9f1239;
    }

    .ua-diag h4 {
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 700;
    }

    .ua-note {
      color: var(--muted);
      font-size: 12.5px;
      margin-top: 10px;
    }

    .ua-grp {
      padding: 8px 0;
      border-top: 1px dashed var(--border);
    }

    .ua-grp:first-child {
      border-top: 0;
    }
  </style>

  <div class="ua-head">
    <div>
      <div class="section-title">Processos com apenas 1 aprovador</div>
      <div class="section-sub">Processos pendentes que só têm <b>uma pessoa elegível</b> para aprovar - a regra exige 2,
        então isto nunca deveria acontecer (o processo trava e não há dupla checagem).</div>
    </div>
    <span class="badge red" id="ua-count" style="font-size:13px">…</span>
  </div>
  <div id="ua-list">
    <div class="empty">Carregando…</div>
  </div>
</main>
