<main>
  <style>
    .ag-grid {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 16px;
      align-items: start;
    }

    .ag-grouplist {
      max-height: 70vh;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .ag-grp {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .ag-grp:hover { background: var(--surface-2); }
    .ag-grp.active { background: var(--accent-weak); color: var(--accent); box-shadow: inset 3px 0 0 var(--accent-bar); }
    .ag-grp .ag-grp-name { font-size: 13.5px; font-weight: 600; }
    .ag-grp small {
      color: var(--muted); font-size: 11px; font-weight: 600;
      background: var(--surface-3); border-radius: 20px; padding: 2px 8px; white-space: nowrap;
    }
    .ag-grp.active small { color: var(--accent); background: #fff; }

    /* detalhe: cabeçalho + ferramentas (busca/filtro) + lista rolável */
    .ag-detail-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .ag-detail-tools { display: flex; gap: 12px; align-items: center; margin: 14px 0 10px; flex-wrap: wrap; }
    .ag-detail-tools .pl-search { flex: 1 1 220px; }
    .ag-only { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text-2); cursor: pointer; white-space: nowrap; user-select: none; }
    .ag-only input { width: 16px; height: 16px; }

    .ag-userlist { max-height: 56vh; overflow: auto; border: 1px solid var(--border); border-radius: 10px; }

    .ag-user {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 8px 13px; border-bottom: 1px solid var(--border-2);
    }
    .ag-user:last-child { border-bottom: 0; }
    .ag-user:hover { background: var(--surface-2); }
    .ag-user:has(input[type=checkbox]:checked) { background: var(--accent-weak); }
    .ag-user-main { display: flex; align-items: center; gap: 11px; cursor: pointer; flex: 1 1 auto; min-width: 0; }
    .ag-user-main input[type=checkbox] { width: 18px; height: 18px; flex: none; accent-color: var(--accent); }
    .ag-user .em { color: var(--muted); font-size: 12.5px; }

    /* edição inline do usuário UAU */
    .ag-uau { flex: none; display: flex; align-items: center; }
    .ag-uau-view { display: flex; align-items: center; gap: 7px; }
    .ag-uau-lbl { color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    .ag-uau-val { font-size: 13px; color: var(--text); max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ag-uau .ag-uau-pen { width: 30px; height: 30px; padding: 0; }
    .ag-uau .ag-uau-pen svg { width: 15px; height: 15px; }
    .ag-uau-form { display: flex; align-items: center; gap: 6px; }
    .ag-uau-input { width: 150px; padding: 6px 9px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-family: inherit; }
    .ag-uau-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak); }
    .ag-uau-form .btn { padding: 6px 10px; font-size: 13px; }

    @media (max-width: 820px) {
      .ag-grid { grid-template-columns: 1fr; }
      .ag-userlist { max-height: 60vh; }
    }
  </style>

  <div class="section-title">Grupos &amp; Usuários</div>
  <div class="section-sub" style="margin-bottom:16px">Selecione um grupo e marque os usuários que pertencem a ele. As
    permissões (empresa, obra, tipo, regras de valor) já vêm das regras migradas do Mitra.</div>

  <div class="ag-grid">
    <div class="card" style="padding:10px">
      <div class="pl-search" style="margin-bottom:8px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="ag-search" placeholder="Filtrar grupos…">
      </div>
      <div class="ag-grouplist" id="ag-groups">
        <div class="empty">Carregando…</div>
      </div>
    </div>

    <div class="card" style="padding:18px 20px">
      <div id="ag-detail">
        <div class="empty">Selecione um grupo à esquerda para gerenciar os usuários.</div>
      </div>
    </div>
  </div>
</main>
