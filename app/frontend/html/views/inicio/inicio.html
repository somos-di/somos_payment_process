<main>
  <section style="min-height:72vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:32px 20px">
    <div style="width:54px;height:54px;background:var(--accent);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);margin-bottom:10px;box-shadow:0 0 0 1px rgba(255,255,255,.05) inset"></div>
    <h1 style="font-family:var(--font-display);font-size:2rem;line-height:1.1;letter-spacing:.04em;margin:0;color:var(--text)">Processo de Pagamento da SOMOS</h1>
    <p style="margin:0;color:var(--text-dim);letter-spacing:.12em;text-transform:uppercase;font-size:12px">Gestão Financeira</p>
    <div style="margin-top:26px;padding:20px 28px;background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);min-width:240px">
      <div style="color:var(--text-dim);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px">Bem-vindo</div>
      <div id="home-user-name" style="font-size:1.15rem;font-weight:600;color:var(--text)">—</div>
      <div id="home-user-email" style="color:var(--text-muted);font-size:13.5px;margin-top:3px"></div>
    </div>
  </section>
</main>
