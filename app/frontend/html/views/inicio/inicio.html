<main>
  <section style="min-height:72vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:32px 20px">
    <h1 style="font-size:1.5rem;font-weight:600;margin:0;color:var(--text)">Processo de Pagamento da SOMOS</h1>
    <p style="margin:4px 0 0;color:var(--text-dim);font-size:13px">Gestão Financeira</p>
    <div style="margin-top:22px">
      <div id="home-user-name" style="font-size:1.05rem;font-weight:500;color:var(--text)">—</div>
      <div id="home-user-email" style="color:var(--text-muted);font-size:13px;margin-top:2px">&nbsp;</div>
    </div>
    <div id="home-quote" style="margin-top:40px;max-width:640px;opacity:0;transition:opacity .6s ease">
      <p id="home-quote-text" style="font-size:1.1rem;font-style:italic;line-height:1.55;color:var(--text);margin:0"></p>
      <p id="home-quote-author" style="margin:10px 0 0;color:var(--text-muted);font-size:13px;letter-spacing:.02em"></p>
    </div>
  </section>
</main>
