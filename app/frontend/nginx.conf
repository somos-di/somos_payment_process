server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API -> backend (same-origin para o browser: cookie httpOnly funciona sem CORS)
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # agente (SSE): same-origin, buffering desligado pro streaming não travar
    location /agent/ {
        proxy_pass http://agent:8100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # assets do app (js/css/html): sem cache, pra sempre servir a versão atual
    # (evita o browser rodar JS/HTML antigo após um deploy).
    location ~* \.(?:js|css|html)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
        try_files $uri /index.html;
    }

    # SPA (hash router): qualquer rota cai no index.html; assets servidos direto
    location / {
        try_files $uri $uri/ /index.html;
    }
}
