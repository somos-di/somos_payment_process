[tool.poetry]
name = "somos-agent"
version = "0.1.0"
description = "Agente conversacional (Azure OpenAI + MCP) do Processo de Pagamento."
authors = ["Somos DI <galahadempr@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
openai = "^1.54.0"
mcp = "^1.2.0"
httpx = "^0.27.0"
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
loguru = "^0.7.3"

[tool.poetry.group.dev.dependencies]
ruff = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
