name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore:
      - main

jobs:
  backend:
    name: Backend (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  python:
    name: Python (syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q app/services/mcps/supabase_mcp app/services/agent

  docker:
    name: Build images (validação)
    runs-on: ubuntu-latest
    needs: [backend, python]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./app/backend
          push: false
          tags: somos-pp-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./app/frontend
          push: false
          tags: somos-pp-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Build supabase_mcp image
        uses: docker/build-push-action@v5
        with:
          context: ./app/services/mcps/supabase_mcp
          push: false
          tags: somos-pp-supabase-mcp:ci
          cache-from: type=gha,scope=supabase-mcp
          cache-to: type=gha,mode=max,scope=supabase-mcp
      - name: Build agent image
        uses: docker/build-push-action@v5
        with:
          context: ./app/services/agent
          push: false
          tags: somos-pp-agent:ci
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent
